[project]
name = "rai-group14"
version = "0.1.0"
description = "Fairness audit of 30-day readmission prediction (UCI Diabetes 130-US Hospitals)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "fairlearn",
    "matplotlib",
    "ucimlrepo",
]

[dependency-groups]
dev = ["pytest", "jupyter", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
