seed: 42

data:
  uci_id: 296
  raw_dir: data/raw
  processed_dir: data/processed

target:
  positive_label: "<30"

sensitive:
  primary: race
  secondary: gender   # or age

split:
  test_size: 0.2
  val_size: 0.2
  group_col: patient_nbr

evaluation:
  n_bootstrap: 1000
  n_cv_folds: 5

model:
  name: logistic_regression

intervention:
  name: threshold_optimizer
  constraint: equalized_odds

output_dir: results
